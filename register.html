<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">Sales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="app">
        <form class="register-container" @submit.prevent="register_user">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" v-model="full_name" class="form-control" id="name"
                    placeholder="Enter your full name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" v-model="email" class="form-control" id="email" aria-describedby="emailHelp"
                    placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" v-model="password" class="form-control" id="password"
                    placeholder="Enter your password">
            </div>
            <div class="mb-3">
                <label for="number" class="form-label">Phone Number</label>
                <input type="tel" v-model="phone_number" class="form-control" id="number"
                    placeholder="Enter your phone number">
            </div>
            <button @click="register_user" type="submit" class="btn btn-primary">Register Here</button>

            <div class="alert alert-success" v-if="alertSuccessShow">
                {{ alert_message }}
            </div>

            <div class="alert alert-danger" v-if="alertDangerShow">
                {{ alert_message }}
            </div>
        </form>
    </div>

    <!-- vue cdn link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js"></script>
    <!-- axios link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.25.0/axios.js"></script>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <script>
        new Vue({
            el: "#app",
            data: {
                full_name: "",
                email: "",
                password: "",
                phone_number: "",
                alert_message: "",
                alertSuccessShow: false,
                alertDangerShow: false
            },
            methods: {
                async register_user() {
                    if (this.full_name === "" || this.email === "" || this.password === "" || this.phone_number === "") {
                        this.alertDangerShow = true
                        this.alert_message = "All fields must be filled."
                        this.alertSuccessShow = false
                        // return stops the method(register_user) from running hence axios won't make a request when fields are empty
                        return
                    }
                    // method 1
                    await axios.post("http://127.0.0.1:5000/register",
                        {
                            full_name: this.full_name,
                            email: this.email,
                            password: this.password,
                            phone_number: this.phone_number
                        }
                    )
                        // response is tos he actual response from the api
                        // .then runs if axirequest is successful
                        .then((response) => {
                            this.alertDangerShow = false;
                            console.log(response.data)
                            this.alertSuccessShow = true;
                            this.alert_message = "Successfully registered"
                            console.log(response.data.token)
                            localStorage.setItem("token", response.data.token)
                            window.location.href = "index.html"
                        }
                        )
                        // . catch is used to catch any error found
                        .catch((error) => {
                            this.alertDangerShow = true;
                            console.log(error.data)
                            this.alertSuccessShow = false;
                            this.alert_message = error.response?.data?.message || "Registration failed"
                        }
                        )
                },
            mounted() {
                if (localStorage.getItem("token") != null) {
                    window.location.href = "index.html"
                }
            }   
            }
        });
    </script>
</body>

</html>
