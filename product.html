<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <img class="logo" src="static/images/logo.png" alt="logo">
            <a class="navbar-brand" href="#">Duka POS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="product.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">Sales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="app">
        <form @submit.prevent="add_products">
            <div class="mb-3">
                <label for="p_name" class="form-label">Product Name</label>
                <input type="text" v-model="product_name" class="form-control" id="p_name"
                    placeholder="Enter the Product Name">
            </div>
            <div class="mb-3">
                <label for="b_price" class="form-label">Buying Price</label>
                <input type="number" v-model="buying_price" class="form-control" id="b_price"
                    placeholder="Enter the Buying Price">
            </div>
            <div class="mb-3">
                <label for="s_price" class="form-label">Selling Price</label>
                <input type="number" v-model="selling_price" class="form-control" id="s_price"
                    placeholder="Enter the Selling Price">
            </div>
            <button type="submit" class="btn btn-primary">Add Products</button>

            <div class="alert alert-success" v-if="alertSuccessShow">
                {{ alert_message }}
            </div>

            <div class="alert alert-danger" v-if="alertDangerShow">
                {{ alert_message }}
            </div>
        </form>

        <table class="table" id="mytable">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Product Name</th>
                    <th scope="col">Buying Price</th>
                    <th scope="col">Selling Price</th>
                    <th scope="col">Created at</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="prod in products" :key="prod.id">
                    <td>{{ prod.id }}</td>
                    <td>{{ prod.product_name }}</td>
                    <td>{{ prod.buying_price }}</td>
                    <td>{{ prod.selling_price }}</td>
                    <td>{{ prod.created_at }}</td>
                    <td><button type="button" class="btn btn-primary" data-bs-toggle="modal"
                            :data-bs-target="'#editproduct' + prod.id">
                            Edit
                        </button>
                        <!-- Modal -->
                        <div class="modal fade" :id="'editproduct' + prod.id" tabindex="-1"
                            aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="exampleModalLabel">Products</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form>
                                            <div class="mb-3">
                                                <label for="name" class="form-label">Product Name</label>
                                                <input type="text" :value=" prod.product_name" class="form-control"
                                                    id="name">
                                            </div>
                                            <div class="mb-3">
                                                <label for="b_price" class="form-label">Buying Price</label>
                                                <input type="number" :value="prod.buying_price" class="form-control"
                                                    id="b_price">
                                            </div>
                                            <div class="mb-3">
                                                <label for="s_price" class="form-label">Selling Price</label>
                                                <input type="number" :value="prod.selling_price" class="form-control"
                                                    id="s_price">
                                            </div>
                                            <button type="submit" class="btn btn-primary">Save Changes</button>
                                        </form>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- datatables -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <!-- vue cdn link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js"></script>
    <!-- axios link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.25.0/axios.js"></script>
    <!-- bootstrap link -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!-- <script>
        new DataTable('#mytable');
    </script> -->
    <script>
        new Vue({
            el: "#app",
            data: {
                product_name: "",
                buying_price: "",
                selling_price: "",
                user_name: "",
                alert_message: "",
                alertSuccessShow: false,
                alertDangerShow: false,
                products: []
            },
            methods: {
                //headers is a vue method for called when
                headers() {
                    return {
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                },
                async add_products() {
                    if (this.product_name === "" || this.buying_price === "" || this.selling_price === "") {
                        this.alertDangerShow = true
                        this.alertSuccessShow = false
                        this.alert_message = "All fields must be filled!!!"
                        return
                    }
                    try {
                        const response = await axios.post("http://127.0.0.1:5000/products", {
                            product_name: this.product_name,
                            buying_price: this.buying_price,
                            selling_price: this.selling_price
                        }, {
                            headers: this.headers()
                        })
                        this.alertSuccessShow = true
                        this.alertDangerShow = false
                        this.alert_message = "Product added successfully!"

                        console.log(response.data)
                    } catch (error)  {
                        this.alertDangerShow = true;
                        console.log(error.data)
                        this.alertSuccessShow = false;
                        this.alert_message = error.response?.data?.message || "Failed to add product."
                        }
                    
                }
            },
            mounted() {
                if (!localStorage.getItem("token")) {
                    window.location.href = "login.html"
                    return
                }
                const user = JSON.parse(localStorage.getItem("user") || "{}")
                this.user_name = user.full_name || user.email || ""
            }
        });
    </script>

</body>

</html>
