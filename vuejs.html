<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!-- Advantages of using a JS Framework(VUE)

1.Two Way Data Binding - Creating a variable in JS and Displaying it easily on an HTML Element.

2.Enables JavaScript IF Statements and FOR Loops on HTML Elements.

3.Enable calling of JavaScript Methods in HTML Elements eg @click.

4.Enables making requests to an API through a JS Library called Axios.Fetch/Store data.

5.Asyncronous ---->
<body>
    <h1>Vue JS Concepts</h1>

    <!-- Everything you want to accessed within Vue is put in a div -->
    <div id="app">

        <!-- calling variables in the data -->
        <p>{{ full_name }}</p> 

        <p>{{ location }}</p>

            <!-- V-if Directives -->
        <p v-if = "marks > 50">Pass</p>

        <p v-if = "marks < 50">Fail</p>

        <ol>
            <!-- V-For Directives  looping through data --> 
            <li v-for="student in students"> {{ student.name }} - {{ student.grade }} - {{ student.loc }}</li>
        </ol>
    </div>

    <!-- Paste vue cdn link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js"></script>
    

    <script>
        new Vue({
            // Capture the div with id app for vue to access
            el : "#app",
            // All variables are stored in data object below
            data : {
                full_name : "Binti Omar Bundu ",
                location : "Mombasa",
                marks : 20,
                students : [
                    {"name" : "John" ,"grade" : "B" ,"loc" : "kisumu"},
                    {"name" : "james" ,"grade" : "A" ,"loc" : "kisii"},
                    {"name" : "mary" ,"grade" : "B" ,"loc" : "nakuru"}
                ]
            },
            // All methods are stored in methods object
            methods : {
                
            }
        });
    </script>
</body>

</html>
