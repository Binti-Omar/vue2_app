<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <img class="logo" src="static/images/logo.png" alt="logo">
            <a class="navbar-brand" href="#">Duka POS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">Sales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="app">
        <form @submit.prevent="add_sales">
            <div class="mb-3">
                <label for="name" class="form-label">Product Name</label>
                <input type="text" v-model="product_name" class="form-control" id="name" aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" v-model="amount" class="form-control" id="amount">
            </div>
            <!-- <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div> -->
            <button type="submit" class="btn btn-primary">Add Sales</button>
        </form>
        <div class="alert alert-success" v-if="alertSuccessShow">
            {{ alert_message }}
        </div>

        <div class="alert alert-danger" v-if="alertDangerShow">
            {{ alert_message }}
        </div>

        <table class="table" id="mytable">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th>product Name</th>
                    <th>Amount</th>
                    <th>Sale Date</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="sale in sales">
                    <th>{{ sale.id }}</th>
                    <td>{{ sale.product_name }}</td>
                    <td>{{ sale.amount.toLocaleString() }}</td>
                    <td>{{ formatDate(sale.sale_date)}}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- vue cdn link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js"></script>
    <!-- axios link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.25.0/axios.js"></script>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- bootstrap link -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!-- datatables -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        new Vue({
            el: "#app",
            data: {
                sales: [],
                product_name:"",
                amount:"",
                alert_message: "",
                alertSuccessShow: false,
                alertDangerShow: false
            },
            methods: {
                get_headers() {
                    return {
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                },
                async add_sales(){
                    if (this.product_name === "" || this.amount=== "") {
                        this.alertDangerShow = true
                        this.alertSuccessShow = false
                        this.alert_message = "All fields must be filled!!!"
                        return
                    }
                    try {
                        const response = await axios.post("http://127.0.0.1:5000/sales", {
                            product_name : this.product_name,
                            amount: parseFloat(this.amount)
                        },{
                            headers: this.get_headers()
                        })
                        this.alertSuccessShow = true
                        this.alertDangerShow = false
                        this.alert_message = "Sales added successfully!"
                        await this.get_sales()
                        // to avoid posting the same data twice
                        this.product_name = ""
                        this.amount = ""
                        setTimeout(() => window.location.href = "product.html", 1000)

                        console.log(response.data)
                    } catch (error) {
                        this.alertDangerShow = true;
                        this.alertSuccessShow = false;

                        console.log("ERROR:", error)
                        console.log("STATUS:", error.response?.status)
                        console.log("DATA:", error.response?.data)

                        this.alert_message = error.response?.data?.message || "Failed to add a sale."
                    } 
                },
                async get_sales() {
                    try {
                        const response = await axios.get("http://127.0.0.1:5000/sales", {
                            headers: this.get_headers()
                        })
                        console.log("full_response:", response)
                        console.log("sales:", response.data)
                        this.sales = response.data
                        this.$nextTick(() => {
                            $('#mytable').DataTable();
                        });
                    } catch (error) {
                        this.alertDangerShow = true;
                        console.log(error.data)

                        this.alertSuccessShow = false;
                        this.alert_message = error.response?.data?.message || "Failed to get sales."
                    }
                },
                formatDate(dt) {
                    console.log("date_received:", dt)
                    return new Date(dt).toLocaleString()
                }
            },
            mounted() {
                if (!localStorage.getItem("token")) {
                    window.location.href = "login.html";
                    return
                }
                this.get_sales()
            }
        })
    </script>
</body>

</html>
